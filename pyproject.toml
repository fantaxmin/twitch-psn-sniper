[project]
name = "twitch-psn-sniper"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "av>=19.0.2",
    "numpy>=2.5.5",
    "onnxruntime-gpu>=1.32.0; sys_platform != 'win32'",
    "onnxruntime; sys_platform == 'win32'",
    "opencv-python-headless>=5.1.0.95",
    "playwright",
    "rapidocr>=3.10.0",
    "streamlink>=8.6.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
